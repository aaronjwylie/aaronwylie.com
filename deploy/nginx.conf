# Reverse proxy: serves the web app at / and the API under /api.
# On a DigitalOcean Droplet, put this in /etc/nginx/sites-available and enable it,
# then run `certbot --nginx -d yourdomain.com` to get free TLS.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # --- Web app (Next.js) ---
    location / {
        # Security headers (the site's own Endpoint Inspector grades these A).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        # CSP allows the app itself plus Vimeo iframe embeds; 'unsafe-inline' is
        # needed for Next.js inline hydration scripts (no nonce setup).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-src https://player.vimeo.com; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API (Fastify) --- strip the /api prefix before forwarding.
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # certbot will inject the listen 443 / ssl_certificate lines here.
}
