# Reverse proxy: serves the web app at / and the API under /api.
# On a DigitalOcean Droplet, put this in /etc/nginx/sites-available and enable it,
# then run `certbot --nginx -d yourdomain.com` to get free TLS.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # --- Web app (Next.js) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API (Fastify) --- strip the /api prefix before forwarding.
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # certbot will inject the listen 443 / ssl_certificate lines here.
}
