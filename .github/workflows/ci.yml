name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, test & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio_test
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate DB migrations (fails if schema drifted from committed SQL)
        run: npm run db:generate --workspace apps/api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: API tests (against Postgres)
        run: npm test --workspace apps/api

      - name: Build API
        run: npm run build --workspace apps/api

      - name: Build web
        run: npm run build --workspace apps/web

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t portfolio-api:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t portfolio-web:ci .
